version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_dev
    ports:
      - "7734:7734"
    volumes:
      - .:/app
      - ./photos:/app/photos
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_NAME}
      - DB_PORT=5432
      - PATH=$PATH:/app/node_modules/.bin
    depends_on:
      - db
    command: mkdir -p /app/photos && npm run dev
  

  db:
    image: postgres:15
    container_name: postgres_dev
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_test
    environment:
      - NODE_ENV=test
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_NAME}
      - DB_PORT=5432
    depends_on:
      - db
    command: npm test
volumes:
  pgdata:
