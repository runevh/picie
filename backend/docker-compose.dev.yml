version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: backend_dev
    ports:
      - "7734:7734"
      - "7735:7735"
    volumes:
      - .:/app
      - backend_dependencies:/app/node_modules
      - ./photos:/app/photos
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_NAME=${POSTGRES_NAME}
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm ci --include=dev --no-audit --no-fund && mkdir -p /app/photos && exec npm run dev"

  

  db:
    image: postgres:15
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    container_name: postgres_dev
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: backend_test
    environment:
      - NODE_ENV=test
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_NAME=${POSTGRES_NAME}
      - DB_PORT=5432
    depends_on:
      - db
    command: npm test
    profiles:
      - test
volumes:
  pgdata:
  backend_dependencies:
