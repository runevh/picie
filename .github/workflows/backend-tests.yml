name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Verify clean production installation
        run: node scripts/test-runtime-install.js
      - name: Run all backend tests
        run: npm test -- --ci --runInBand --coverage=false --json --outputFile=test-results.json
      - name: Write test summary
        if: always()
        run: node scripts/test-summary.js
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.json
          if-no-files-found: ignore
          retention-days: 14

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  e2e-tests:
    name: End-to-end journeys
    runs-on: ubuntu-24.04
    env:
      E2E_PG_BIN: /usr/lib/postgresql/16/bin
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e --prefix frontend
      - name: Upload journey reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            frontend/e2e-report/
            frontend/e2e-results/
          retention-days: 14

  firmware-tests:
    name: Firmware tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - run: python -m unittest discover -s tests -p embedded_portal_test.py -v
      - run: pio test -d device -e native
      - run: pio run -d device -e esp12e
      - run: python -m unittest discover -s tests -p firmware_security_test.py -v

  report:
    name: Test summary
    if: always()
    needs: [tests, browser-tests, e2e-tests, firmware-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Write combined report
        env:
          BACKEND: ${{ needs.tests.result }}
          BROWSER: ${{ needs.browser-tests.result }}
          E2E: ${{ needs.e2e-tests.result }}
          FIRMWARE: ${{ needs.firmware-tests.result }}
        run: |
          printf '## Test results\n\n| Check | Result |\n|---|---|\n| Backend | %s |\n| Browser | %s |\n| End-to-end | %s |\n| Firmware tests and build | %s |\n' "$BACKEND" "$BROWSER" "$E2E" "$FIRMWARE" >> "$GITHUB_STEP_SUMMARY"
