name: Deploy

concurrency:
  group: picie-production
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy exact revision over verified SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          : "${VPS_HOST_FINGERPRINT:?Set the trusted VPS host fingerprint}"
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          ssh-keyscan -T 10 -H "$VPS_HOST" > "$ssh_dir/known_hosts"
          bash deploy/verify-host.sh "$ssh_dir/known_hosts" "$VPS_HOST_FINGERPRINT"
          {
            printf 'set -euo pipefail\nmkdir -p ~/.ssh\nchmod 700 ~/.ssh\n'
            printf "cat > ~/.ssh/picie-github-known-hosts <<'GITHUB_KEYS'\n"
            cat deploy/github-known-hosts
            printf "GITHUB_KEYS\n"
            printf "export GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/picie-github-known-hosts'\n"
            cat deploy/remote.sh
          } | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" -i "$ssh_dir/key" "$VPS_USER@$VPS_HOST" bash -s -- "$GITHUB_SHA"
