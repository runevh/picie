version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=7734
    depends_on:
      - db
    ports:
      - "7734:7734"
      - "7735:7735"
    volumes:
      - ./backend/photos:/app/photos

  frontend:
    build: ./frontend
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
