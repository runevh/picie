services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=7734
    depends_on:
      - db
    ports:
      - "127.0.0.1:7734:7734"
      - "127.0.0.1:7735:7735"
    volumes:
      - ./backend/photos:/app/photos

volumes:
  pgdata:
